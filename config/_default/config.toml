[params]
    brand = "Krähenbeißer"
    #brand_logo = "images/kraehenbeisser.svg"
    description = "Historische Abbildungen von Krähenbeißern"
    errorimg = "/images/kraehenbeisser.svg"
    rssinmenu = true
    keywords = "Krähenbeißer, Krajebieter, Kurische Nehrung, Kurisches Haff, Curonian Lagoon, Curonian Spit"
    stylesheets = []
    copyrightYears = "MMXXI - MMXXIII"
    cc = false
    disableScale = true
    debug = false
    schemaPerson = "https://christianmahnke.de/person.jsonld"

    [params.preview]
        outputPrefix = "ogPreview-overlay"
        outputSuffix = ".png"
        format =  "svg"
        image = "front.png"
        source = "overlay"
        [params.preview.size]
            height = 630
            width = 1200
        [params.preview.svg]
            template = "./Source Files/Other/preview-template.svg"
            scale = "width"
            removeMissing = true

    [params.footer]
        privacy = true

[params.author]
  email = 'mail@christianmahnke.de'
  name = 'Christian Mahnke'
  uri = 'http://www.wikidata.org/entity/Q137668638'

# pnpm >= 12 generates /bin/sh shims in node_modules/.bin, which Hugo's
# PostCSS integration rejects ("binary postcss is not a Node.js script").
# The dedupe step is the only PostCSS use in the build, so it is disabled.
[params.css]
  dedupe = false
