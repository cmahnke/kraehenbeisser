<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" dir="ltr">
  {{ partial "head.html" . }}
  <body class="error404body">
    {{ partial "nav-bar.html" . }}
    <main id="main">
      <div class="error404">
       <h1>
           <a href="{{ "/" | relURL }}">{{ i18n "page_not_found" }}</a>
       </h1>
      {{ if site.Params.errorimg -}}
          <img src="{{ site.Params.errorimg }}" alt="{{ i18n "page_does_not_exist" }}"/>
      {{- end }}
    </main>
    {{ partial "scripts.html" . }}
  </body>
</html>
